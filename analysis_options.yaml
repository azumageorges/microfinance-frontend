include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # DropdownButtonFormField.value est le paramètre correct — faux positif
    # du SDK qui confond avec le getter FormFieldState.value déprécié
    deprecated_member_use: ignore

linter:
  rules:
    # prefer_initializing_formals : style suggestif, non bloquant.
    # Les constructeurs avec initialisation explicite (`: _field = param`)
    # sont parfaitement valides et nécessaires pour les champs privés avec
    # paramètres nommés publics.
    prefer_initializing_formals: false
