server {

    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    # Ne pas divulguer la version de nginx
    server_tokens off;

    # En-têtes de sécurité
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Flutter Web : `wasm-unsafe-eval` et gstatic (CanvasKit) sont requis ;
    # `connect-src https:` couvre les appels vers l'API backend.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    location / {

        try_files $uri $uri/ /index.html;

    }

}
